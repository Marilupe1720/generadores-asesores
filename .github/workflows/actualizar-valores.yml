name: Actualizar valores UDI y dólar (Banxico)

on:
  schedule:
    - cron: '0 14 * * *'   # 8:00 a.m. hora de Ciudad de México
    - cron: '0 19 * * *'   # 1:00 p.m. hora de Ciudad de México (ya publicado el FIX del día)
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consultar Banxico
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: node scripts/actualizar_valores.js
      - name: Guardar cambios
        run: |
          git config user.name "actualizador-banxico"
          git config user.email "actions@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || (git commit -m "Actualiza UDI y dólar FIX" && git push)
